<title id="title">Proceso SDD completo - toolkit detallado</title>
<desc id="desc">Mapa detallado del proceso SDD con Fase 0, ciclo de feature, deploy y artefactos de gobierno. 21 artefactos del toolkit organizados visualmente.</desc>

