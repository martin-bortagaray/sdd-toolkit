<g class="c-purple">
<rect x="190" y="1090" width="400" height="48" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="1106.5" text-anchor="middle" dominant-baseline="central">Commit único: feat(&lt;ID&gt;): …</text>
<text class="ts" x="390.0" y="1121.5" text-anchor="middle" dominant-baseline="central">ok = autoriza el commit · ok push = también pushea</text>
</g>

<polyline points="390,1068 390,1088" class="arr" marker-end="url(#arrow)"/>

<text class="lbl" x="396" y="1082">ok</text>

