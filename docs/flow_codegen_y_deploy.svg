<rect x="574" y="404" width="172" height="52" rx="8" stroke-width="0.8"/>
<text class="th" x="660.0" y="415.0" text-anchor="middle" dominant-baseline="central">Corregir</text>
<text class="ts" x="660.0" y="430.0" text-anchor="middle" dominant-baseline="central">máx. 2 intentos; al 3º frenar:</text>
<text class="ts" x="660.0" y="445.0" text-anchor="middle" dominant-baseline="central">revisar la spec (§8.2)</text>
</g>

<polyline points="540,430 572,430" class="arr" marker-end="url(#arrow)"/>

<text class="lbl" x="544" y="424">rojo</text>

<polyline points="660,404 660,336 592,336" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<polygon points="390,508.0 500.0,540 390,572.0 280.0,540" stroke-width="0.8"/>
<text class="th" x="390" y="532.5" text-anchor="middle" dominant-baseline="central">¿Última capa</text>
<text class="th" x="390" y="547.5" text-anchor="middle" dominant-baseline="central">del plan?</text>
</g>

<polyline points="390,468 390,508" class="arr" marker-end="url(#arrow)"/>

<text class="lbl" x="396" y="492">verde</text>

<polyline points="280,540 110,540 110,276 188,276" class="arr" marker-end="url(#arrow)"/>

