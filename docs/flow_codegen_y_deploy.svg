<text class="th" x="390.0" y="1180.5" text-anchor="middle" dominant-baseline="central">Deploy a staging</text>
<text class="ts" x="390.0" y="1195.5" text-anchor="middle" dominant-baseline="central">git checkout staging &amp;&amp; git merge feature/&lt;ID&gt; &amp;&amp; git push</text>
</g>

<polyline points="390.0,1138 390.0,1162" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<polygon points="390,1238.0 505.0,1270 390,1302.0 275.0,1270" stroke-width="0.8"/>
