<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 780 1538" role="img" aria-labelledby="title desc">
<title id="title">Flujo de codegen (MODO FEATURE) y deploy — WORKFLOW v20</title>
<desc id="desc">Fase 6 en MODO FEATURE: plan único, generación capa por capa con tests primero y gate automático, una revisión de código por feature, prueba manual que autoriza el commit, y deploy a staging y producción.</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t { font-size: 14px; font-weight: 400; }
  .th { font-size: 13px; font-weight: 600; }
  .ts { font-size: 11px; font-weight: 400; }
  .tt { font-size: 18px; font-weight: 700; fill: #2C2C2A; }
  .tsub { font-size: 12px; fill: #5F5E5A; }
  .tag { font-size: 9px; font-weight: 700; letter-spacing: 0.6px; }
  .c-gray rect, .c-gray polygon { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts, .c-gray .tag { fill: #5F5E5A; }
  .c-purple rect, .c-purple polygon { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #3C3489; } .c-purple .ts, .c-purple .tag { fill: #534AB7; }
  .c-teal rect, .c-teal polygon { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #085041; } .c-teal .ts, .c-teal .tag { fill: #0F6E56; }
  .c-blue rect, .c-blue polygon { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts, .c-blue .tag { fill: #185FA5; }
  .c-amber rect, .c-amber polygon { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th { fill: #633806; } .c-amber .ts, .c-amber .tag { fill: #854F0B; }
  .c-coral rect, .c-coral polygon { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #712B13; } .c-coral .ts, .c-coral .tag { fill: #993C1D; }
  .c-pink rect, .c-pink polygon { fill: #FBEAF0; stroke: #993556; }
  .c-pink .th { fill: #72243E; } .c-pink .ts, .c-pink .tag { fill: #993556; }
  .arr { stroke: #5F5E5A; stroke-width: 1.4; fill: none; }
  .lbl { font-size: 10px; fill: #5F5E5A; font-weight: 600; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="780" height="1538" fill="#FFFFFF"/>
<text class="tt" x="30" y="36">Fase 6 — Codegen (MODO FEATURE) y deploy</text>

<text class="tsub" x="30" y="56">Un plan, capas seguidas con gate automático, una revisión de código, una prueba manual, un commit.</text>

<g class="c-gray">
<rect x="190" y="76" width="400" height="48" rx="22" stroke-width="0.8"/>
<text class="th" x="390.0" y="92.5" text-anchor="middle" dominant-baseline="central">Spec Approved + plan confirmado</text>
<text class="ts" x="390.0" y="107.5" text-anchor="middle" dominant-baseline="central">G2/G3 (Completo) · plan junto a la aprobación (Rápido / Estándar)</text>
</g>

<g class="c-purple">
<rect x="190" y="146" width="400" height="48" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="162.5" text-anchor="middle" dominant-baseline="central">Rama feature/&lt;ID&gt; desde main</text>
<text class="ts" x="390.0" y="177.5" text-anchor="middle" dominant-baseline="central">git checkout main &amp;&amp; git pull &amp;&amp; git checkout -b feature/&lt;ID&gt;</text>
</g>

<polyline points="390.0,124 390.0,146" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="20" y="216" width="740" height="446" rx="12" stroke-width="0.8"/>
<text class="th" x="390.0" y="439.0" text-anchor="middle" dominant-baseline="central"></text>
</g>

<text class="th" x="36" y="236" fill="#2C2C2A" text-anchor="start">LOOP por capa</text>

<text class="ts" x="744" y="236" fill="#5F5E5A" text-anchor="end">capas del plan: 1 Datos → 2 Negocio → 3 API → 4 UI · sin gates humanos</text>

<polyline points="390.0,194 390,248" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="190" y="250" width="400" height="52" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="268.5" text-anchor="middle" dominant-baseline="central">Tests primero</text>
<text class="ts" x="390.0" y="283.5" text-anchor="middle" dominant-baseline="central">CA de §8 y casos borde de §9 que tocan la capa → fallan</text>
</g>

<g class="c-purple">
<rect x="190" y="322" width="400" height="52" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="340.5" text-anchor="middle" dominant-baseline="central">Implementar la capa</text>
<text class="ts" x="390.0" y="355.5" text-anchor="middle" dominant-baseline="central">Write/Edit a disco · modificación: solo ítems del CHANGE-SET</text>
</g>

<polyline points="390.0,302 390.0,322" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<polygon points="390,392.0 540.0,430 390,468.0 240.0,430" stroke-width="0.8"/>
<text class="th" x="390" y="422.5" text-anchor="middle" dominant-baseline="central">Gate automático</text>
<text class="th" x="390" y="437.5" text-anchor="middle" dominant-baseline="central">tests + suite + typecheck/build</text>
</g>

<polyline points="390.0,374 390,392" class="arr" marker-end="url(#arrow)"/>

