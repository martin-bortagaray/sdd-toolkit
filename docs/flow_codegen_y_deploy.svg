<text class="ts" x="390.0" y="1357.5" text-anchor="middle" dominant-baseline="central">git checkout main &amp;&amp; git merge feature/&lt;ID&gt; &amp;&amp; git push</text>
</g>

<polyline points="390,1302 390,1322" class="arr" marker-end="url(#arrow)"/>

<text class="lbl" x="396" y="1316">sí</text>

