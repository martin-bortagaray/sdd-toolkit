<polyline points="390.0,1214 390,1238" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="574" y="1244" width="172" height="52" rx="8" stroke-width="0.8"/>
<text class="th" x="660.0" y="1255.0" text-anchor="middle" dominant-baseline="central">Ajustes</text>
<text class="ts" x="660.0" y="1270.0" text-anchor="middle" dominant-baseline="central">cambio de producto →</text>
<text class="ts" x="660.0" y="1285.0" text-anchor="middle" dominant-baseline="central">/sdd-feature &lt;ID&gt; &quot;cambio&quot;</text>
</g>

<polyline points="505,1270 572,1270" class="arr" marker-end="url(#arrow)"/>

<text class="lbl" x="520" y="1264">no</text>

