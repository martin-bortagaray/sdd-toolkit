<text class="ts" x="390.0" y="1429.5" text-anchor="middle" dominant-baseline="central">git branch -d feature/&lt;ID&gt;</text>
</g>

<polyline points="390.0,1376 390.0,1398" class="arr" marker-end="url(#arrow)"/>

