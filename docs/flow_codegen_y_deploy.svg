<g class="c-purple">
<rect x="190" y="590" width="400" height="52" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="608.5" text-anchor="middle" dominant-baseline="central">Decisiones técnicas por defecto</text>
<text class="ts" x="390.0" y="623.5" text-anchor="middle" dominant-baseline="central">se acumulan en una lista (se validan en G4)</text>
</g>

<polyline points="390,572 390,588" class="arr" marker-end="url(#arrow)"/>

<text class="lbl" x="396" y="584">sí</text>

<g class="c-purple">
<rect x="140" y="684" width="500" height="66" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="702.0" text-anchor="middle" dominant-baseline="central">Revisión de código — una por feature (según track)</text>
<text class="ts" x="390.0" y="717.0" text-anchor="middle" dominant-baseline="central">Completo / nueva Estándar: diff completo · grande: 2 subagentes en paralelo</text>
<text class="ts" x="390.0" y="732.0" text-anchor="middle" dominant-baseline="central">Modif. Estándar / Rápido con lógica: acotada al diff · pura presentación: inline</text>
</g>

<polyline points="390.0,642 390.0,684" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<polygon points="390,768.0 505.0,800 390,832.0 275.0,800" stroke-width="0.8"/>
<text class="th" x="390" y="800.0" text-anchor="middle" dominant-baseline="central">¿Bloqueantes?</text>
</g>

<polyline points="390.0,750 390,768" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="574" y="774" width="172" height="52" rx="8" stroke-width="0.8"/>
<text class="th" x="660.0" y="785.0" text-anchor="middle" dominant-baseline="central">Corregir + re-gate</text>
<text class="ts" x="660.0" y="800.0" text-anchor="middle" dominant-baseline="central">decisión de alto impacto →</text>
<text class="ts" x="660.0" y="815.0" text-anchor="middle" dominant-baseline="central">interrupción</text>
</g>

<polyline points="505,800 572,800" class="arr" marker-end="url(#arrow)"/>

<text class="lbl" x="520" y="794">sí</text>

<g class="c-purple">
<rect x="190" y="852" width="400" height="44" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="866.5" text-anchor="middle" dominant-baseline="central">No bloqueantes → sdd/DEBT.md</text>
<text class="ts" x="390.0" y="881.5" text-anchor="middle" dominant-baseline="central">formato /sdd-defer, tipo deuda-tecnica</text>
</g>

<polyline points="390,832 390,850" class="arr" marker-end="url(#arrow)"/>

<text class="lbl" x="396" y="846">no</text>

<g class="c-amber">
<rect x="140" y="918" width="500" height="66" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="936.0" text-anchor="middle" dominant-baseline="central">G4 · Prueba manual acotada</text>
<text class="ts" x="390.0" y="951.0" text-anchor="middle" dominant-baseline="central">Ya cubierto por tests: listado, no se repite · a mano: experiencia,</text>
<text class="ts" x="390.0" y="966.0" text-anchor="middle" dominant-baseline="central">integraciones reales, ≥1 happy path en el entorno real</text>
<text class="tag" x="148" y="929">GATE</text>
</g>

<polyline points="390.0,896 390.0,918" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<polygon points="390,1004.0 500.0,1036 390,1068.0 280.0,1036" stroke-width="0.8"/>
<text class="th" x="390" y="1036.0" text-anchor="middle" dominant-baseline="central">¿Funciona?</text>
</g>

<polyline points="390.0,984 390,1004" class="arr" marker-end="url(#arrow)"/>

<polyline points="280,1036 70,1036 70,348 188,348" class="arr" marker-end="url(#arrow)"/>

