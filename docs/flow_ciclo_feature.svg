<g class="c-purple">
<rect x="140" y="858" width="500" height="66" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="876.0" text-anchor="middle" dominant-baseline="central">Revisión de código — una por feature</text>
<text class="ts" x="390.0" y="891.0" text-anchor="middle" dominant-baseline="central">Completo / nueva Estándar: diff completo (2 subagentes si es grande)</text>
<text class="ts" x="390.0" y="906.0" text-anchor="middle" dominant-baseline="central">Modif. Estándar / Rápido con lógica: acotada al diff · pura presentación: inline</text>
</g>

<polyline points="390.0,836 390.0,858" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber">
<rect x="140" y="946" width="500" height="66" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="964.0" text-anchor="middle" dominant-baseline="central">G4 · Prueba manual acotada → commit</text>
<text class="ts" x="390.0" y="979.0" text-anchor="middle" dominant-baseline="central">Lo cubierto por tests no se repite · a mano: experiencia, integraciones, happy path real</text>
<text class="ts" x="390.0" y="994.0" text-anchor="middle" dominant-baseline="central">ok = commit único · ok push · falla → vuelve a código</text>
<text class="tag" x="148" y="957">GATE</text>
</g>

<polyline points="390.0,924 390.0,946" class="arr" marker-end="url(#arrow)"/>

