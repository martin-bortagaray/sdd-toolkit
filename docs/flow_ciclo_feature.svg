<text class="th" x="390.0" y="788.0" text-anchor="middle" dominant-baseline="central">Implementación autónoma (rama feature/&lt;ID&gt;)</text>
<text class="ts" x="390.0" y="803.0" text-anchor="middle" dominant-baseline="central">Tests de §8/§9 primero → capas 1→4 del plan</text>
<text class="ts" x="390.0" y="818.0" text-anchor="middle" dominant-baseline="central">Gate automático entre capas: tests + typecheck · sin gates humanos</text>
