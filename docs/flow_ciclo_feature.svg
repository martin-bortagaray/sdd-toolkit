<text class="th" x="390.0" y="1048.5" text-anchor="middle" dominant-baseline="central">Commit feat(&lt;ID&gt;) → deploy staging → main</text>
<text class="ts" x="390.0" y="1063.5" text-anchor="middle" dominant-baseline="central">tras el merge a main: spec e INDEX → Implemented</text>
</g>

<polyline points="390.0,1012 390.0,1034" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="25" y="1100" width="360" height="96" rx="8" stroke-width="0.8"/>
<text class="th" x="205.0" y="1118.0" text-anchor="middle" dominant-baseline="central">Válvula de escape</text>
<text class="ts" x="205.0" y="1133.0" text-anchor="middle" dominant-baseline="central">Si aparece riesgo que el track no admite,</text>
<text class="ts" x="205.0" y="1148.0" text-anchor="middle" dominant-baseline="central">el track sube en el acto y se ejecutan</text>
<text class="ts" x="205.0" y="1163.0" text-anchor="middle" dominant-baseline="central">los pasos salteados antes de seguir.</text>
<text class="ts" x="205.0" y="1178.0" text-anchor="middle" dominant-baseline="central">Queda en el changelog de la spec (Regla 5).</text>
</g>

<g class="c-gray">
<rect x="395" y="1100" width="360" height="96" rx="8" stroke-width="0.8"/>
<text class="th" x="575.0" y="1118.0" text-anchor="middle" dominant-baseline="central">Interrupciones legítimas (fuera de gates)</text>
<text class="ts" x="575.0" y="1133.0" text-anchor="middle" dominant-baseline="central">Decisión de alto impacto no prevista · válvula</text>
<text class="ts" x="575.0" y="1148.0" text-anchor="middle" dominant-baseline="central">Conflicto spec vs foundation · semáforo ROJO</text>
<text class="ts" x="575.0" y="1163.0" text-anchor="middle" dominant-baseline="central">Tests en rojo tras 2 intentos de corrección</text>
<text class="ts" x="575.0" y="1178.0" text-anchor="middle" dominant-baseline="central">Nada más frena el flujo.</text>
</g>
