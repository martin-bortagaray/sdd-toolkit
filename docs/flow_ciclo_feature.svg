<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 780 1226" role="img" aria-labelledby="title desc">
<title id="title">Flujo del ciclo de feature — Modo Flow (WORKFLOW v20)</title>
<desc id="desc">Ciclo SDD por feature ejecutado con /sdd-feature: clasificación por track (Rápido, Estándar, Completo), gates humanos por track, implementación autónoma con gate automático, revisión de código única y prueba manual que autoriza el commit.</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t { font-size: 14px; font-weight: 400; }
  .th { font-size: 13px; font-weight: 600; }
  .ts { font-size: 11px; font-weight: 400; }
  .tt { font-size: 18px; font-weight: 700; fill: #2C2C2A; }
  .tsub { font-size: 12px; fill: #5F5E5A; }
  .tag { font-size: 9px; font-weight: 700; letter-spacing: 0.6px; }
  .c-gray rect, .c-gray polygon { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts, .c-gray .tag { fill: #5F5E5A; }
  .c-purple rect, .c-purple polygon { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #3C3489; } .c-purple .ts, .c-purple .tag { fill: #534AB7; }
  .c-teal rect, .c-teal polygon { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #085041; } .c-teal .ts, .c-teal .tag { fill: #0F6E56; }
  .c-blue rect, .c-blue polygon { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue .th { fill: #0C447C; } .c-blue .ts, .c-blue .tag { fill: #185FA5; }
  .c-amber rect, .c-amber polygon { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th { fill: #633806; } .c-amber .ts, .c-amber .tag { fill: #854F0B; }
  .c-coral rect, .c-coral polygon { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #712B13; } .c-coral .ts, .c-coral .tag { fill: #993C1D; }
  .c-pink rect, .c-pink polygon { fill: #FBEAF0; stroke: #993556; }
  .c-pink .th { fill: #72243E; } .c-pink .ts, .c-pink .tag { fill: #993556; }
  .arr { stroke: #5F5E5A; stroke-width: 1.4; fill: none; }
  .lbl { font-size: 10px; fill: #5F5E5A; font-weight: 600; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="780" height="1226" fill="#FFFFFF"/>
<text class="tt" x="30" y="36">Ciclo de feature — Modo Flow</text>

<text class="tsub" x="30" y="56">Una invocación de /sdd-feature recorre el ciclo. Frena solo en los gates (ámbar) del track: Rápido 2 · Estándar 3 · Completo 4.</text>

<g class="c-gray">
<rect x="190" y="76" width="400" height="44" rx="22" stroke-width="0.8"/>
<text class="th" x="390.0" y="90.5" text-anchor="middle" dominant-baseline="central">Necesidad o cambio</text>
<text class="ts" x="390.0" y="105.5" text-anchor="middle" dominant-baseline="central">/sdd-feature &quot;necesidad&quot;   ·   /sdd-feature &lt;ID&gt; &quot;cambio&quot;</text>
</g>

<g class="c-purple">
<rect x="140" y="142" width="500" height="62" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="158.0" text-anchor="middle" dominant-baseline="central">Paso 0 — ¿Qué es? (reanudable desde .flow.md)</text>
<text class="ts" x="390.0" y="173.0" text-anchor="middle" dominant-baseline="central">Bug → /sdd-bugfix (Flujo C)  ·  Modificación → prompt 07  ·  Feature nueva → prompt 08</text>
<text class="ts" x="390.0" y="188.0" text-anchor="middle" dominant-baseline="central">La propuesta de track va dentro del primer gate</text>
</g>

<polyline points="390.0,120 390.0,142" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<polygon points="390,225.0 515.0,262 390,299.0 265.0,262" stroke-width="0.8"/>
<text class="th" x="390" y="254.5" text-anchor="middle" dominant-baseline="central">Track</text>
<text class="th" x="390" y="269.5" text-anchor="middle" dominant-baseline="central">(criterios de riesgo)</text>
</g>

<polyline points="390.0,204 390,225" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="25" y="338" width="226" height="58" rx="8" stroke-width="0.8"/>
<text class="th" x="138.0" y="352.0" text-anchor="middle" dominant-baseline="central">RÁPIDO — 2 gates</text>
<text class="ts" x="138.0" y="367.0" text-anchor="middle" dominant-baseline="central">Sin modelo, reglas, seguridad, dinero,</text>
<text class="ts" x="138.0" y="382.0" text-anchor="middle" dominant-baseline="central">contratos, irreversible ni compartidos</text>
</g>

<g class="c-blue">
<rect x="277" y="338" width="226" height="58" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="352.0" text-anchor="middle" dominant-baseline="central">ESTÁNDAR — 3 gates</text>
<text class="ts" x="390.0" y="367.0" text-anchor="middle" dominant-baseline="central">Toca modelo de datos o reglas,</text>
<text class="ts" x="390.0" y="382.0" text-anchor="middle" dominant-baseline="central">o agrega un flujo / entidad</text>
</g>

<g class="c-coral">
<rect x="529" y="338" width="226" height="58" rx="8" stroke-width="0.8"/>
<text class="th" x="642.0" y="352.0" text-anchor="middle" dominant-baseline="central">COMPLETO — 4 gates</text>
<text class="ts" x="642.0" y="367.0" text-anchor="middle" dominant-baseline="central">Seguridad, dinero, contrato externo,</text>
<text class="ts" x="642.0" y="382.0" text-anchor="middle" dominant-baseline="central">irreversible o grande</text>
</g>

<polyline points="265,262 138,262 138,336" class="arr" marker-end="url(#arrow)"/>

<polyline points="390,299 390,336" class="arr" marker-end="url(#arrow)"/>

<polyline points="515,262 642,262 642,336" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="25" y="418" width="226" height="58" rx="8" stroke-width="0.8"/>
<text class="th" x="138.0" y="432.0" text-anchor="middle" dominant-baseline="central">Mini-spec o delta</text>
<text class="ts" x="138.0" y="447.0" text-anchor="middle" dominant-baseline="central">§1, 2, 4, 8, 9, 14, 15</text>
<text class="ts" x="138.0" y="462.0" text-anchor="middle" dominant-baseline="central">modificación: CHANGE-SET mínimo</text>
</g>

<g class="c-purple">
<rect x="25" y="498" width="226" height="58" rx="8" stroke-width="0.8"/>
<text class="th" x="138.0" y="512.0" text-anchor="middle" dominant-baseline="central">Checks express inline</text>
<text class="ts" x="138.0" y="527.0" text-anchor="middle" dominant-baseline="central">verify EXPRESS (F2, F5, F6, C3–C5)</text>
<text class="ts" x="138.0" y="542.0" text-anchor="middle" dominant-baseline="central">sin revisión adversaria (Regla 4)</text>
</g>

<g class="c-amber">
<rect x="25" y="578" width="226" height="58" rx="8" stroke-width="0.8"/>
<text class="th" x="138.0" y="592.0" text-anchor="middle" dominant-baseline="central">Aprobación única</text>
<text class="ts" x="138.0" y="607.0" text-anchor="middle" dominant-baseline="central">track + spec/delta + plan</text>
<text class="ts" x="138.0" y="622.0" text-anchor="middle" dominant-baseline="central">leí, apruebo</text>
<text class="tag" x="33" y="589">GATE</text>
</g>

<g class="c-purple">
<rect x="277" y="418" width="226" height="58" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="432.0" text-anchor="middle" dominant-baseline="central">Spec-first en lote</text>
<text class="ts" x="390.0" y="447.0" text-anchor="middle" dominant-baseline="central">prompt 08 (modif.: 07 + CHANGE-SET)</text>
<text class="ts" x="390.0" y="462.0" text-anchor="middle" dominant-baseline="central">alto impacto → [DECIDIR-N]</text>
</g>

<g class="c-amber">
<rect x="277" y="498" width="226" height="58" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="512.0" text-anchor="middle" dominant-baseline="central">G1 · Preguntas en lote</text>
<text class="ts" x="390.0" y="527.0" text-anchor="middle" dominant-baseline="central">confirmo track · opciones + recomendación</text>
<text class="ts" x="390.0" y="542.0" text-anchor="middle" dominant-baseline="central">ok · ok salvo 3:B</text>
<text class="tag" x="285" y="509">GATE</text>
</g>

<g class="c-purple">
<rect x="277" y="578" width="226" height="58" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="592.0" text-anchor="middle" dominant-baseline="central">Revisión unificada</text>
<text class="ts" x="390.0" y="607.0" text-anchor="middle" dominant-baseline="central">subagente: adversaria + verify</text>
<text class="ts" x="390.0" y="622.0" text-anchor="middle" dominant-baseline="central">modificación: acotada al delta</text>
</g>

<g class="c-amber">
<rect x="277" y="658" width="226" height="58" rx="8" stroke-width="0.8"/>
<text class="th" x="390.0" y="672.0" text-anchor="middle" dominant-baseline="central">G2 + G3 · Spec y plan</text>
<text class="ts" x="390.0" y="687.0" text-anchor="middle" dominant-baseline="central">superficie de decisión (§4,6,7,8,10,14)</text>
<text class="ts" x="390.0" y="702.0" text-anchor="middle" dominant-baseline="central">leí, apruebo</text>
<text class="tag" x="285" y="669">GATE</text>
</g>

<g class="c-amber">
<rect x="529" y="418" width="226" height="58" rx="8" stroke-width="0.8"/>
<text class="th" x="642.0" y="432.0" text-anchor="middle" dominant-baseline="central">G1 · Discovery profundo</text>
<text class="ts" x="642.0" y="447.0" text-anchor="middle" dominant-baseline="central">track confirmado al abrir</text>
<text class="ts" x="642.0" y="462.0" text-anchor="middle" dominant-baseline="central">prompts 01 → 02, por sección</text>
<text class="tag" x="537" y="429">GATE</text>
</g>

<g class="c-purple">
<rect x="529" y="498" width="226" height="58" rx="8" stroke-width="0.8"/>
<text class="th" x="642.0" y="512.0" text-anchor="middle" dominant-baseline="central">Revisión unificada completa</text>
<text class="ts" x="642.0" y="527.0" text-anchor="middle" dominant-baseline="central">adversaria + verify COMPLETO</text>
<text class="ts" x="642.0" y="542.0" text-anchor="middle" dominant-baseline="central">pasada 2 solo si hubo bloqueantes</text>
</g>

<g class="c-amber">
<rect x="529" y="578" width="226" height="58" rx="8" stroke-width="0.8"/>
<text class="th" x="642.0" y="592.0" text-anchor="middle" dominant-baseline="central">G2 · Aprobación de spec</text>
<text class="ts" x="642.0" y="607.0" text-anchor="middle" dominant-baseline="central">superficie de decisión</text>
<text class="ts" x="642.0" y="622.0" text-anchor="middle" dominant-baseline="central">leí, apruebo · §14 en lote</text>
<text class="tag" x="537" y="589">GATE</text>
</g>

<g class="c-amber">
<rect x="529" y="658" width="226" height="58" rx="8" stroke-width="0.8"/>
<text class="th" x="642.0" y="672.0" text-anchor="middle" dominant-baseline="central">G3 · Plan único</text>
<text class="ts" x="642.0" y="687.0" text-anchor="middle" dominant-baseline="central">una tabla para todas las capas</text>
<text class="ts" x="642.0" y="702.0" text-anchor="middle" dominant-baseline="central">plan ok</text>
<text class="tag" x="537" y="669">GATE</text>
</g>

